name: Android ARM64 Build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  android-arm64:
    name: Build ModelForge-Android-ARM64 (APK & AAB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true
      - name: Build Android ARM64 APK and AAB
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -o pipefail
          bash platform/android/build_android.sh 2>&1 | tee android-build.log || {
            details=$(tail -n 70 android-build.log | tr '\n' ' ' | cut -c 1-6000)
            echo "::error::Android build failed: $details"
            exit 1
          }
      - name: Verify ARM64 & ARMv7 native ABIs inside APK
        run: |
          python3 - <<'PY'
          import zipfile, pathlib
          apk = pathlib.Path("release_artifacts/ModelForge-Android-ARM64.apk")
          aab = pathlib.Path("release_artifacts/ModelForge-Android-ARM64.aab")
          assert apk.exists() and apk.stat().st_size > 1_000_000, "APK missing or too small"
          assert aab.exists() and aab.stat().st_size > 1_000_000, "AAB missing or too small"
          with zipfile.ZipFile(apk) as zf:
              names = zf.namelist()
              arm64_libs = [n for n in names if n.startswith("lib/arm64-v8a/")]
              armv7_libs = [n for n in names if n.startswith("lib/armeabi-v7a/")]
              assert arm64_libs, f"No arm64-v8a libraries found in APK! Entries sample: {names[:20]}"
              assert armv7_libs, "No armeabi-v7a libraries found in APK!"
              print("Verified Android ARM64 + ARMv7 libs:", len(arm64_libs), len(armv7_libs))
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: ModelForge-Android-APK-Only
          path: release_artifacts/ModelForge-Android-ARM64.apk
      - uses: actions/upload-artifact@v7
        with:
          name: ModelForge-Android-ARM64
          path: |
            release_artifacts/ModelForge-Android-ARM64.apk
            release_artifacts/ModelForge-Android-ARM64.aab
            release_artifacts/ModelForge-Android-ARM64.SIGNING_STATUS.txt

  android-offline-emulator:
    name: Android offline training smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true
      - name: Prepare Flutter and bundled runtime
        run: python3 scripts/prepare_flutter_platforms.py
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test embedded training on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          disable-animations: true
          script: |
            cd apps/flutter_app
            flutter test integration_test/offline_test.dart > "$RUNNER_TEMP/offline-test.log" 2>&1 || {
              cat "$RUNNER_TEMP/offline-test.log"
              details=$(tail -n 60 "$RUNNER_TEMP/offline-test.log" | tr '\n' ' ' | cut -c 1-6000)
              echo "::error::Offline emulator test failed: $details"
              exit 1
            }
