name: Linux x64 Build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  linux-x64:
    name: Build ModelForge-Linux-x64 (AppImage & DEB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux GTK3 & packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev file desktop-file-utils
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Python Core & PyInstaller
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[full]" pyinstaller
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true
      - name: Build Linux x64 DEB and AppImage
        run: bash platform/linux/build_linux.sh
      - name: Verify DEB metadata & AppImage executable
        run: |
          dpkg-deb --info release_artifacts/ModelForge-Linux-x64.deb
          file release_artifacts/ModelForge-Linux-x64.AppImage
          test -s release_artifacts/ModelForge-Linux-x64.deb
          test -s release_artifacts/ModelForge-Linux-x64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: ModelForge-Linux-x64
          path: |
            release_artifacts/ModelForge-Linux-x64.AppImage
            release_artifacts/ModelForge-Linux-x64.deb
