name: macOS Build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  macos-dmg:
    name: Build ModelForge-macOS (DMG)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Python Core & PyInstaller
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[full,dev]" pyinstaller
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true
      - name: Build macOS DMG
        run: bash platform/macos/build_macos.sh
      - name: Run macOS smoke verification
        run: |
          test -s release_artifacts/ModelForge-macOS.dmg
          python3 scripts/smoke_e2e.py
      - uses: actions/upload-artifact@v7
        with:
          name: ModelForge-macOS
          path: |
            release_artifacts/ModelForge-macOS.dmg
            release_artifacts/ModelForge-macOS.SIGNING_STATUS.txt
