name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to publish (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true
      - name: Build Android ARM64
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: bash platform/android/build_android.sh
      - uses: actions/upload-artifact@v7
        with:
          name: release-android
          path: release_artifacts/ModelForge-Android-ARM64*

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[full,dev]" pyinstaller
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - shell: pwsh
        run: ./platform/windows/build_windows.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: release_artifacts/ModelForge-Windows-x64*

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev file desktop-file-utils
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[full]" pyinstaller
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true
      - run: bash platform/linux/build_linux.sh
      - uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: release_artifacts/ModelForge-Linux-x64*

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[full]" pyinstaller
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true
      - run: bash platform/macos/build_macos.sh
      - uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: release_artifacts/ModelForge-macOS*

  publish-release:
    needs: [build-android, build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: collected_assets
          merge-multiple: true
      - name: Generate SHA256SUMS
        working-directory: collected_assets
        run: sha256sum ModelForge-* > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3.0.4
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            collected_assets/ModelForge-Android-ARM64.apk
            collected_assets/ModelForge-Android-ARM64.aab
            collected_assets/ModelForge-Android-ARM64.SIGNING_STATUS.txt
            collected_assets/ModelForge-Windows-x64-Setup.exe
            collected_assets/ModelForge-Windows-x64-Portable.zip
            collected_assets/ModelForge-Linux-x64.AppImage
            collected_assets/ModelForge-Linux-x64.deb
            collected_assets/ModelForge-macOS.dmg
            collected_assets/ModelForge-macOS.SIGNING_STATUS.txt
            collected_assets/SHA256SUMS.txt
