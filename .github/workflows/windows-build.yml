name: Windows x64 Build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  windows-x64:
    name: Build ModelForge-Windows-x64 (Setup EXE & Portable ZIP)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Python Core & PyInstaller
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[full,dev]" pyinstaller
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.2"
          channel: stable
          cache: true
      - name: Build Windows x64 Portable ZIP and Setup EXE
        shell: pwsh
        run: ./platform/windows/build_windows.ps1
      - name: Verify Windows x64 artifacts & smoke test
        shell: pwsh
        run: |
          if (-not (Test-Path "release_artifacts/ModelForge-Windows-x64-Portable.zip")) { throw "Missing Portable ZIP" }
          if (-not (Test-Path "release_artifacts/ModelForge-Windows-x64-Setup.exe")) { throw "Missing Setup EXE" }
          python scripts/smoke_e2e.py
      - uses: actions/upload-artifact@v4
        with:
          name: ModelForge-Windows-x64
          path: |
            release_artifacts/ModelForge-Windows-x64-Setup.exe
            release_artifacts/ModelForge-Windows-x64-Portable.zip
