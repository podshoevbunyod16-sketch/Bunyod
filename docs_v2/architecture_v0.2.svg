<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" font-family="system-ui,Arial,sans-serif">
<rect width="1000" height="620" fill="#fafafa"/>
<text x="500" y="30" text-anchor="middle" font-size="20" font-weight="bold">RASM-CIM v0.2 — интегрированная архитектура</text>
<!-- Input -->
<rect x="30" y="60" width="180" height="70" rx="10" fill="#dbeafe" stroke="#111"/>
<text x="120" y="85" text-anchor="middle" font-weight="bold">Вход</text>
<text x="120" y="105" text-anchor="middle" font-size="12">int / факт / программа</text>
<text x="120" y="120" text-anchor="middle" font-size="12">последовательность / инструмент</text>
<!-- RNS -->
<rect x="280" y="60" width="200" height="70" rx="10" fill="#dcfce7" stroke="#111"/>
<text x="380" y="85" text-anchor="middle" font-weight="bold">Packed RNS</text>
<text x="380" y="105" text-anchor="middle" font-size="12">int → остатки (uint16)</text>
<text x="380" y="120" text-anchor="middle" font-size="12">CRT, carry-free, op-count</text>
<!-- SSM -->
<rect x="550" y="60" width="220" height="70" rx="10" fill="#fef3c7" stroke="#111"/>
<text x="660" y="85" text-anchor="middle" font-weight="bold">Selective SSM</text>
<text x="660" y="105" text-anchor="middle" font-size="12">lam_t=sigmoid(Wx), h=tanh(...)</text>
<text x="660" y="120" text-anchor="middle" font-size="12">context_id = sign(h[0:8])</text>
<!-- CAM -->
<rect x="280" y="180" width="490" height="110" rx="10" fill="#fee2e2" stroke="#111"/>
<text x="525" y="205" text-anchor="middle" font-weight="bold">CAM2 (симуляция, не железо)</text>
<text x="525" y="225" text-anchor="middle" font-size="12">exact dict + inverted index (partial) + HV store (noisy)</text>
<text x="525" y="242" text-anchor="middle" font-size="12">ключ = (RNS-остатки, context_id)  •  порог tau → UNKNOWN</text>
<text x="525" y="259" text-anchor="middle" font-size="12">Hopfield retrieval: softmax(beta·QKᵀ)V</text>
<text x="525" y="276" text-anchor="middle" font-size="12">счётчик операций (comparisons)</text>
<!-- Resonator -->
<rect x="30" y="340" width="220" height="80" rx="10" fill="#e0e7ff" stroke="#111"/>
<text x="140" y="365" text-anchor="middle" font-weight="bold">Resonator2</text>
<text x="140" y="385" text-anchor="middle" font-size="12">факторизация HV</text>
<text x="140" y="400" text-anchor="middle" font-size="12">confidence + brute fallback</text>
<!-- Logic -->
<rect x="280" y="340" width="220" height="80" rx="10" fill="#f3e8ff" stroke="#111"/>
<text x="390" y="365" text-anchor="middle" font-weight="bold">Logic2</text>
<text x="390" y="385" text-anchor="middle" font-size="12">query / compose / contradiction</text>
<text x="390" y="400" text-anchor="middle" font-size="12">refusal при sim &lt; tau</text>
<!-- Program -->
<rect x="530" y="340" width="220" height="80" rx="10" fill="#ffedd5" stroke="#111"/>
<text x="640" y="365" text-anchor="middle" font-weight="bold">Program2 (1–3 оп.)</text>
<text x="640" y="385" text-anchor="middle" font-size="12">HV-последовательность, пошагово</text>
<text x="640" y="400" text-anchor="middle" font-size="12">SafeInterpreter (AST, без eval)</text>
<!-- Tools -->
<rect x="780" y="340" width="190" height="80" rx="10" fill="#ecfccb" stroke="#111"/>
<text x="875" y="365" text-anchor="middle" font-weight="bold">Tools</text>
<text x="875" y="385" text-anchor="middle" font-size="12">CAM-выбор инструмента</text>
<text x="875" y="400" text-anchor="middle" font-size="12">валидированный вызов</text>
<!-- Output -->
<rect x="280" y="470" width="490" height="70" rx="10" fill="#111" stroke="#111"/>
<text x="525" y="495" text-anchor="middle" fill="#fff" font-weight="bold">Выход + confidence / UNKNOWN / CONFLICT</text>
<text x="525" y="515" text-anchor="middle" fill="#fff" font-size="12">+ счётчики операций • ablation-флаги • без eval/exec</text>
<!-- Arrows -->
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#111"/></marker></defs>
<line x1="210" y1="95" x2="275" y2="95" stroke="#111" stroke-width="2" marker-end="url(#a)"/>
<line x1="480" y1="95" x2="545" y2="95" stroke="#111" stroke-width="2" marker-end="url(#a)"/>
<line x1="380" y1="130" x2="380" y2="175" stroke="#111" stroke-width="2" marker-end="url(#a)"/>
<line x1="660" y1="130" x2="660" y2="175" stroke="#111" stroke-width="2" marker-end="url(#a)"/>
<line x1="140" y1="290" x2="140" y2="335" stroke="#111" stroke-width="2" marker-end="url(#a)"/>
<line x1="390" y1="290" x2="390" y2="335" stroke="#111" stroke-width="2" marker-end="url(#a)"/>
<line x1="640" y1="290" x2="640" y2="335" stroke="#111" stroke-width="2" marker-end="url(#a)"/>
<line x1="875" y1="290" x2="875" y2="335" stroke="#111" stroke-width="2" marker-end="url(#a)"/>
<line x1="140" y1="420" x2="140" y2="465" stroke="#111" stroke-width="2" marker-end="url(#a)"/>
<line x1="390" y1="420" x2="390" y2="465" stroke="#111" stroke-width="2" marker-end="url(#a)"/>
<line x1="640" y1="420" x2="640" y2="465" stroke="#111" stroke-width="2" marker-end="url(#a)"/>
<line x1="875" y1="420" x2="875" y2="465" stroke="#111" stroke-width="2" marker-end="url(#a)"/>
<text x="500" y="580" text-anchor="middle" font-size="13">Абляция: отключение SSM ломает контекст-зависимый recall (F7) • отключение CAM ломает шум/partial • Resonator ускоряет факторизацию с fallback</text>
<text x="500" y="600" text-anchor="middle" font-size="12" fill="#666">CAM — программная симуляция. Аппаратные скорость/энергия не измерялись и не заявляются.</text>
</svg>
