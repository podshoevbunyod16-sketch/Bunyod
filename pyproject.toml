[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "rasm-cim"
version = "0.16.0"
description = "RASM-CIM: residue-addressable associative memory over streaming storage (experimental, offline, stdlib-first)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.optional-dependencies]
dev = ["pytest", "hypothesis", "atheris"]
numpy = ["numpy>=1.26"]

[project.scripts]
rasm-cim-demo = "rasm_cim_v9.cli:main"

[tool.setuptools]
packages = ["rasm_cim_v9", "rasm_cim_v9.storage", "rasm_cim_v9.memory",
            "rasm_cim_v8", "rasm_cim_v8.storage", "rasm_cim_v8.memory", "rasm_cim_v8.hv",
            "rasm_cim_v16"]
