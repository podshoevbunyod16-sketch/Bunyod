[package]
name = "rasm_cim_rust"
version = "0.7.0"
edition = "2021"
description = "RASM-CIM v0.7 Rust compute core: RNS, memory, CA, reservoir, synthesis, packed storage"
license = "MIT"

[lib]
name = "rasm_cim_rust"
path = "src/lib.rs"

[[bin]]
name = "rasm_cim"
path = "src/main.rs"

[dependencies]
thiserror = "2"
rayon = "1"
rand = { version = "0.8", features = ["small_rng"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.bench]
opt-level = 3
lto = true

[[bench]]
name = "core"
harness = false
